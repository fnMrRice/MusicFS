[versions]
agp = "9.2.1"
kotlin = "2.3.21"
activity = "1.13.0"
compose = "1.11.1"
material = "1.4.0"
lifecycle = "2.10.0"
coroutines = "1.10.2"
okhttp = "4.12.0"
media3 = "1.8.0"
wear = "1.5.0"
testRunner = "1.7.0"
testJunit = "1.3.0"

[libraries]
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
material = { module = "androidx.compose.material3:material3", version.ref = "material" }
wear = { module = "androidx.wear.compose:compose-material", version.ref = "wear" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
player = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
session = { module = "androidx.media3:media3-session", version.ref = "media3" }
mediahttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
android-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }

[plugins]
application = { id = "com.android.application", version.ref = "agp" }
library = { id = "com.android.library", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
